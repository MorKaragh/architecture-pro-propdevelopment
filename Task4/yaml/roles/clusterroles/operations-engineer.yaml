apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operations-engineer
rules:
# Чтение всех ресурсов
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
# Просмотр секретов (привилегированное право)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
# Доступ к логам
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
# Доступ к событиям
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

