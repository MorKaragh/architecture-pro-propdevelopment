apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredSecurityContexts
metadata:
  name: require-security-contexts
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["audit-zone"]
  parameters:
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true

